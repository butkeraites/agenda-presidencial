name: Atualizar agenda presidencial

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Instalar dependencias
        run: pip install -r requirements-pipeline.txt

      - name: Baixar stopwords do NLTK
        run: python -m nltk.downloader stopwords

      - name: Gerar calendario
        run: python agenda-presidencial/code/gerar_calendario.py

      - name: Carregar calendario no banco
        run: python agenda-presidencial/code/calendario.py

      - name: Coletar agenda
        run: python agenda-presidencial/code/main.py

      - name: Processar dados
        run: python agenda-presidencial/code/gerar_dados.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda-presidencial/code/data
          git diff --cached --quiet || git commit -m "Atualizacao automatica dos dados da agenda"
          git push
